[project]
name = "clef-bench-vllm"
version = "0.1.0"
description = "vLLM 0.29 plugin: Clef joint-schema head as a pooling model returning raw logits (clef-quant-bench)"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = []

[project.entry-points."vllm.general_plugins"]
clef_bench = "clef_bench_vllm:register"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["clef_bench_vllm"]
